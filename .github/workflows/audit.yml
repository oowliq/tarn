name: audit

# Проверка зависимостей по базе уязвимостей RustSec. Исключения — в .cargo/audit.toml.
# Раз в неделю — чтобы узнать о новых уязвимостях, даже если код не менялся.
on:
  push:
    branches: ["**"]
    paths: ["Cargo.toml", "Cargo.lock", ".cargo/audit.toml", ".github/workflows/audit.yml"]
  pull_request:
    paths: ["Cargo.toml", "Cargo.lock", ".cargo/audit.toml", ".github/workflows/audit.yml"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
